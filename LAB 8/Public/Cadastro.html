<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - LAB 8</title>
    <link rel="stylesheet" href="/estilo.css">
</head>
<body>
    <main>
        <h1>Cadastrar usuário</h1>
        <p>Preencha os dados para criar seu cadastro.</p>
        <form action="/cadastra" method="post">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" maxlength="80" autocomplete="name" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" maxlength="254" autocomplete="email" required>

            <label for="senha">Senha (mínimo de 6 caracteres)</label>
            <input type="password" id="senha" name="senha" minlength="6" maxlength="128" autocomplete="new-password" required>

            <button type="submit">Cadastrar</button>
        </form>
        <p>Já tem cadastro? <a href="/login">Fazer login</a></p>
        <a href="/Projects.html">Voltar aos projetos</a>
    </main>
</body>
</html>
