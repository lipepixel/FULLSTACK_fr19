<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LAB 8</title>
    <link rel="stylesheet" href="/estilo.css">
</head>
<body>
    <main>
        <h1>Login</h1>
        <p>Entre com o e-mail e a senha que você cadastrou.</p>
        <form action="/login" method="post">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" maxlength="254" autocomplete="username" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" minlength="6" maxlength="128" autocomplete="current-password" required>

            <button type="submit">Entrar</button>
        </form>
        <p>Ainda não tem cadastro? <a href="/cadastra">Cadastrar</a></p>
        <a href="/Projects.html">Voltar aos projetos</a>
    </main>
</body>
</html>
